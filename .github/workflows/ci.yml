name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package (ncc bundle)
        run: npm run package

      - name: Verify dist is up to date
        run: |
          if [ "$(git diff --stat -- dist/)" != "" ]; then
            echo "::error::The dist/ folder is out of date. Run 'npm run package' and commit the changes."
            git diff -- dist/
            exit 1
          fi
