name: 'OpenSpec PR Action'
description: 'Validates OpenAPI specification files changed in a pull request and posts a comment with the results'
author: 'acatl'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token used to authenticate API requests and post PR comments'
    required: true
    default: ${{ github.token }}
  spec-glob:
    description: 'Glob pattern used to identify OpenAPI spec files in the repository'
    required: false
    default: '**/*.{yaml,yml,json}'
  ruleset:
    description: 'Path to a custom Spectral ruleset file (.spectral.yaml, .spectral.json, etc.)'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the action when validation errors are found'
    required: false
    default: 'true'
  fail-on-warning:
    description: 'Fail the action when validation warnings are found'
    required: false
    default: 'false'

outputs:
  result:
    description: 'Validation result summary: "passed", "warnings", or "failed"'
  error-count:
    description: 'Number of validation errors found'
  warning-count:
    description: 'Number of validation warnings found'

runs:
  using: 'node20'
  main: 'dist/index.js'
